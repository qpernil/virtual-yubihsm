[package]
name = "virtual-yubihsm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Transport-neutral YubiHSM 2 compatible software device core"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["firmware-full"]
firmware-yubihsm2 = []
firmware-secure-channel = []
firmware-full = []
test-firmware-prefixed-ecdh = []
test-firmware-session-objects = []
persistent-runtime = ["software-key-core/state-persistence"]

[dependencies]
ciborium = "0.2.2"
const-oid = "0.10.2"
der = { version = "0.8.1", features = ["alloc", "derive", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
software-key-core = { workspace = true, features = ["x509-signing"] }
spki = { version = "0.8.0", features = ["alloc", "std"] }
subtle = "2.6.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["builder", "std"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
