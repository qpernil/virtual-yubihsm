[package]
name = "yubihsm-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Transport-independent qualification scenarios for YubiHSM-compatible devices"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
der = { version = "0.8.1", features = ["std"] }
getrandom = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdh"] }
platform-credential = { path = "../../../pkcs11rs/crates/platform-credential", optional = true }
pcsc = { version = "2.9.0", optional = true }
software-key-core = { workspace = true }
virtual-yubihsm-core = { path = "../virtual-yubihsm-core", default-features = false }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
yubihsm-auth-client = { path = "../../../pkcs11rs/crates/yubihsm-auth-client", optional = true }
zeroize = "1.9.0"

[features]
default = ["firmware-full"]
firmware-yubihsm2 = ["virtual-yubihsm-core/firmware-yubihsm2"]
firmware-secure-channel = ["virtual-yubihsm-core/firmware-secure-channel"]
firmware-full = ["virtual-yubihsm-core/firmware-full"]
platform-credential = ["dep:platform-credential"]
native-hsmauth = ["dep:pcsc", "dep:yubihsm-auth-client"]

[[bin]]
name = "yubihsm-qualification"
path = "src/main.rs"
