[package]
name = "virtual-yubihsm-i2c"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Unprivileged I2C target frontend for virtual-yubihsm-core"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libc = "0.2.189"
virtual-yubihsm-core = { path = "../virtual-yubihsm-core", features = ["persistent-runtime"] }

[[bin]]
name = "virtual-yubihsm-i2c"
path = "src/main.rs"
