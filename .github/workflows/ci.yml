name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  personas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stock
            cargo_args: --no-default-features
          - name: prefixed-ecdh
            cargo_args: --no-default-features --features prefixed-ecdh
          - name: session-objects
            cargo_args: --no-default-features --features session-objects
          - name: secure-channel-derivation
            cargo_args: --no-default-features --features secure-channel-derivation
          - name: full
            cargo_args: --features full

    name: persona (${{ matrix.name }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/pkcs11rs.git ../pkcs11rs
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Test compiled persona
        run: cargo test --locked -p virtual-yubihsm-core ${{ matrix.cargo_args }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/pkcs11rs.git ../pkcs11rs
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pkg-config

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/pkcs11rs.git ../pkcs11rs
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pkg-config

      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace --all-features
