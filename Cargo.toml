[package]
name = "virtual-yubihsm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A privilege-separated software implementation of the YubiHSM 2 device protocol"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = [
    "crates/virtual-yubihsm-i2c",
    "crates/virtual-yubihsm-core",
    "crates/yubihsm-qualification",
]
resolver = "2"

[workspace.dependencies]
software-key-core = { path = "../software-key-core" }

[features]
# Build the ordinary worker against simulated I/O for process tests.
worker-harness = ["usb-gadget-worker-io/simulated"]
default = ["firmware-full"]
firmware-yubihsm2 = ["virtual-yubihsm-core/firmware-yubihsm2"]
firmware-protected-derivation = ["virtual-yubihsm-core/firmware-protected-derivation"]
firmware-full = ["virtual-yubihsm-core/firmware-full"]

[dependencies]
libc = "0.2.191"
virtual-yubihsm-core = { path = "crates/virtual-yubihsm-core", default-features = false, features = ["persistent-runtime"] }

[target.'cfg(unix)'.dependencies]
usb-gadget-worker-io = { path = "../usb-gadget-supervisor/crates/usb-gadget-worker-io" }
usb-gadget-worker = { path = "../usb-gadget-supervisor/crates/usb-gadget-worker" }
display-backends = { path = "../display-backends" }

[[bin]]
name = "virtual-yubihsm-worker"
path = "src/main.rs"

[dev-dependencies]
usb-gadget-harness = { path = "../usb-gadget-supervisor/crates/usb-gadget-harness" }

[[test]]
name = "worker_harness"
path = "tests/worker_harness.rs"
required-features = ["worker-harness"]
